frequency: 10  # EKF 업데이트 주기 (10Hz)
publish_tf: true  # EKF에서 map -> odom 변환을 퍼블리시
map_frame: map
world_frame: map
odom_frame: odom
base_link_frame: base_link

# 🔹 IMU 데이터 설정
imu0: /imu/data
imu0_config: [false, false, false,  # IMU는 x, y, z 위치를 제공하지 않음
              true, true, true,     # IMU의 roll, pitch, yaw를 사용
              false, false, false,  # IMU는 선속도를 제공하지 않음
              true, true, true,     # IMU의 각속도를 사용 (yaw rate 포함)
              false, false, false]  # 가속도 값은 사용하지 않음

# 🔹 Scan Odometry 데이터 설정
odom0: /scan_odometry
odom0_config: [true, true, false,   # Scan Odometry는 x, y 위치를 제공
               false, false, true,  # Scan Odometry는 yaw(방위각)도 제공
               true, true, false,   # Scan Odometry는 vx, vy 속도 제공
               false, false, true,  # Scan Odometry는 yaw 속도(omega) 제공
               false, false, false] # Scan Odometry는 가속도 정보를 제공하지 않음

# 🔹 공분산 (Covariance) 가중치 설정
odom0_differential: false  # Scan Odometry는 절대 위치 데이터를 제공
odom0_relative: false

imu0_differential: true  # IMU는 상대적 변화량(각속도)만 제공
imu0_relative: true

# 🔹 초기값 설정
initial_state: [0, 0, 0, 0, 0, 0,  # x, y, z, roll, pitch, yaw
                0, 0, 0, 0, 0, 0,  # vx, vy, vz, angular velocity
                0, 0, 0]           # 가속도 (사용 안 함)

# 🔹 노이즈 공분산 (더 신뢰할 센서를 낮은 값으로 설정)
process_noise_covariance: [0.05, 0, 0, 0, 0, 0,  
                            0, 0.05, 0, 0, 0, 0,  
                            0, 0, 0.001, 0, 0, 0,  
                            0, 0, 0, 0.01, 0, 0,  
                            0, 0, 0, 0, 0.01, 0,  
                            0, 0, 0, 0, 0, 0.001]

# 🔹 센서 데이터 신뢰도 조정 (작을수록 신뢰도 높음)
imu0_queue_size: 10
imu0_remove_gravitational_acceleration: true  # IMU의 중력 가속도 제거

odom0_queue_size: 10
two_d_mode: true
