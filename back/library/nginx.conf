
server {
    listen 80;
    server_name localhost;

    location /robotphoto/ {
        root /;
        autoindex on;
    }

    location /api/ {
        proxy_pass http://springboot-container:8080;  # Spring Boot 컨테이너로 프록시 요청
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass http://springboot-container:8080;  # Spring Boot WebSocket 엔드포인트
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;   # 연결이 끊어지지 않도록 설정
    }

    location /mqtt {
        proxy_pass http://mosquitto:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}