DWAPlannerROS: 
  max_vel_x: 0.3
  min_vel_x: -0.6

  max_vel_y: 0.0
  min_vel_y: 0.0

  max_vel_theta: 0.8
  min_vel_theta: -0.8
  min_in_place_vel_theta: 0.4

  min_vel_trans: 0.5

  acc_lim_x: 1.0
  acc_lim_y: 0.0
  acc_lim_theta: 1.0

  sim_time: 5.0
  sim_granularity: 0.05

  vx_samples: 25
  vy_samples: 0
  vtheta_samples: 15

  xy_goal_tolerance: 0.1
  yaw_goal_tolerance: 0.05
  latch_xy_goal_tolerance: false

  path_distance_bias: 25.0
  goal_distance_bias: 15.0
  occdist_scale: 0.02

  forward_point_distance: 0.7
  stop_time_buffer: 0.2
  scaling_speed: 0.1
  max_scaling_factor: 0.2

  oscillation_reset_dist: 0.2
  
  publish_traj_pc: true
  publish_cost_grid_pc: true

  escape_vel: -0.3
  holonomic_robot: false
  allow_backward: true
